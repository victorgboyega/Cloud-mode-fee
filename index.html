<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cloud Mode Fee | Secure Payments</title>
<style>
body{font-family:Arial;margin:0;background:#f5f8ff;color:#13213c}.wrap{max-width:900px;margin:50px auto;padding:20px}
.card{background:#fff;padding:30px;border-radius:18px;box-shadow:0 12px 35px #dfe6f5}h1{color:#2457d6}
input{width:100%;padding:13px;margin:7px 0 14px;border:1px solid #d8e0ef;border-radius:8px;box-sizing:border-box}
button{width:100%;padding:14px;border:0;border-radius:8px;background:#2457d6;color:#fff;font-weight:700;font-size:16px;cursor:pointer}
#msg{margin-top:15px;color:#52617a}.brand{font-weight:800;font-size:25px;color:#2457d6;margin-bottom:25px}
</style></head>
<body><div class="wrap"><div class="brand">Cloud Mode Fee</div><div class="card">
<h1>Make a secure payment</h1><p>Pay fees online using supported Nigerian payment methods.</p>
<form id="pay">
<input name="name" placeholder="Full name" required>
<input name="email" type="email" placeholder="Email address" required>
<input name="reference" placeholder="What are you paying for?" required>
<input name="amount" type="number" min="100" step="1" placeholder="Amount (NGN)" required>
<button>Continue to secure payment</button>
</form><div id="msg"></div>
</div></div>
<script>
document.getElementById("pay").addEventListener("submit", async e=>{
 e.preventDefault(); const msg=document.getElementById("msg"); msg.textContent="Opening secure checkout…";
 const body=Object.fromEntries(new FormData(e.target));
 try{const r=await fetch("/api/create-payment",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
 const d=await r.json(); if(!r.ok) throw new Error(d.error||"Payment error"); location.href=d.link;
 }catch(err){msg.textContent=err.message}
});
</script></body></html>
